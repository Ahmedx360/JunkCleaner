name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name JunkCleaner windows_cleaner.py

      - uses: actions/upload-artifact@v4
        with:
          name: JunkCleaner-windows
          path: dist/JunkCleaner.exe

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JunkCleaner.exe
